name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            archive: session-id-gen-linux-x86_64
            binary: session-id-gen

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            archive: session-id-gen-linux-aarch64
            binary: session-id-gen

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            archive: session-id-gen-windows-x86_64
            binary: session-id-gen.exe

          # Windows ARM64
          - target: aarch64-pc-windows-msvc
            archive: session-id-gen-windows-aarch64
            binary: session-id-gen.exe

          # macOS Intel
          - target: x86_64-apple-darwin
            archive: session-id-gen-macos-x86_64
            binary: session-id-gen

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            archive: session-id-gen-macos-aarch64
            binary: session-id-gen

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p release

          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "release/${{ matrix.archive }}${{ matrix.binary == 'session-id-gen.exe' && '.exe' || '' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release/*


  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Generate release information
        id: release
        shell: bash
        run: |
          VERSION="$(date -u +'%Y%m%d')"
          COMMIT="$(git rev-parse HEAD)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."

            gh release upload "$VERSION" \
              release/* \
              --clobber

            gh release edit "$VERSION" \
              --title "$VERSION" \
              --notes "$COMMIT"
          else
            gh release create "$VERSION" \
              release/* \
              --title "$VERSION" \
              --notes "$COMMIT" \
              --target "$COMMIT"
          fi

